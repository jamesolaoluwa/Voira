# Optional: scale the backend on CPU. Needs metrics-server in the cluster
# (on minikube: `minikube addons enable metrics-server`). The API is stateless,
# so horizontal scaling is safe. Apply this only when you want to watch it work.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voira-api
  namespace: voira
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voira-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
