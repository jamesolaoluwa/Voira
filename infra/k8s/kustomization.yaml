# Core deployable set. Apply with: kubectl apply -k infra/k8s/
# secret.example.yaml (template) and hpa.yaml (optional) are intentionally
# excluded, so a bulk apply never installs placeholder secrets or requires
# metrics-server. Create secret.yaml from the template before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voira

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
