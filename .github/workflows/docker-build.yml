name: Build container images

# Optional. Builds the API and web images and pushes them to the GitHub
# Container Registry so the Kubernetes manifests can pull a tagged image
# instead of a local build. The app deploys fine without this workflow.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infra/Dockerfile"
      - "apps/web/Dockerfile"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The web image needs public VITE_* build args (anon key, publishable
          # keys, DSN). These are client-side public values, supplied from repo
          # secrets; the API URL is the production backend. Unset secrets build
          # as empty strings, which simply disables that feature in the image.
          build-args: |
            VITE_API_BASE_URL=https://voira-api.onrender.com
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_STRIPE_PRICE_ID_MONTHLY=${{ secrets.VITE_STRIPE_PRICE_ID_MONTHLY }}
            VITE_STRIPE_PRICE_ID_YEARLY=${{ secrets.VITE_STRIPE_PRICE_ID_YEARLY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
